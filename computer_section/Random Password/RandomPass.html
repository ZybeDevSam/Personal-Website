    <title>Samuel Belin - Random Password Generator</title>
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; } catch (e) { }</script>
    <link rel="icon" href="../../Assets/me/favicon.png" type="image/png">
    <link rel="stylesheet" href="RandomPass.css">
    <link rel="stylesheet" href="../../Global/global.css" />

<body>
    <div id="tsparticles"><!--auto loads canvas--></div>
    <div>
        <canvas id="background"></canvas>

                        <input type="checkbox" id="checkbox" aria-label="Toggle dark mode" />
                        <div class="slider round"></div>
                    </label>
                </div>
            </li>
        </ul>
    </nav>

    <div class="holder">
        <div class="container">
            <h2>Random Password Generator</h2>
            <label for="length">Password Length:</label>
            <input type="number" id="length" min="1" value="16"><br>

            <label for="includeSpecial">Include Special Characters:</label>
            <input type="checkbox" id="includeSpecial"><br>

            <label for="includeUpper">Include Uppercase Letters:</label>
            <input type="checkbox" id="includeUpper"><br>

            <label for="includeNums">Include Numbers:</label>
            <input type="checkbox" id="includeNums"><br>

            <button onclick="generateRandomPassword()" class="button">Generate Password</button>
            <p id="password"></p>
        </div>
        <div class="button-container">
            <a href="../../index.html#projects" class="home-button">Return Home</a>
        </div>
    </div>
